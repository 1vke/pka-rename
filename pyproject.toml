[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pka-rename"
version = "1.0.0"
description = "Rename the user profile embedded inside Cisco Packet Tracer .pka/.pkt files"
readme = "README.md"
authors = [{ name = "Lucas Lowe" }]
# twofish needs `imp`, removed in Python 3.12
requires-python = ">=3.9,<3.12"
dependencies = ["twofish"]
keywords = ["packet-tracer", "pka", "pkt", "twofish", "cisco", "networking"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Education",
    "Topic :: Security :: Cryptography",
    "Topic :: System :: Networking",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

[project.scripts]
pka-rename = "pka.cli:main"

[tool.setuptools]
packages = ["pka", "pka.crypto"]
