[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pka-rename"
version = "1.0.0"
description = "Rename the user profile embedded inside Cisco Packet Tracer .pka/.pkt files"
readme = "README.md"
authors = [{ name = "Lucas Lowe" }]
# the `twofish` dependency still imports the removed `imp` module,
# so this tool cannot run on Python 3.12+
requires-python = ">=3.9,<3.12"
dependencies = ["twofish"]
keywords = ["packet-tracer", "pka", "pkt", "twofish", "cisco", "networking"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Education",
    "Topic :: Security :: Cryptography",
    "Topic :: System :: Networking",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

[project.urls]
# format reference implementations this tool is based on
Homepage = "https://github.com/mircodz/pka2xml"
Repository = "https://github.com/strykey/pka-decipher"

[project.scripts]
pka-rename = "pka.cli:main"

[tool.setuptools]
packages = ["pka", "pka.crypto"]
