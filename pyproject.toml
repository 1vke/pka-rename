[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pka-rename"
version = "1.1.0"
description = "Edit the user profile embedded inside a Cisco Packet Tracer `.pka` / `.pkt` activity file."
readme = "README.md"
authors = [{ name = "Lucas Lowe" }]
requires-python = ">=3.9,<3.12"
dependencies = ["twofish==0.3.0"]
keywords = ["packet-tracer", "pka", "pkt", "twofish", "cisco", "networking"]
classifiers = [
    "Environment :: Console",
    "Topic :: Security :: Cryptography",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

[project.scripts]
pka-rename = "pka.cli:main"

[tool.setuptools]
packages = ["pka", "pka.crypto"]
